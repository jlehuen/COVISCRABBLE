name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: coviscrabble-macos
            archive_name: coviscrabble-macos.zip
          - os: windows-latest
            artifact_name: coviscrabble-windows
            archive_name: coviscrabble-windows.zip
          - os: ubuntu-latest
            artifact_name: coviscrabble-linux
            archive_name: coviscrabble-linux.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux dependencies (Tkinter)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Run unit tests
        run: |
          python test_core.py

      - name: Build standalone binaries
        run: |
          python build_dist.py

      - name: Package archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../coviscrabble-macos.zip *

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist\* -DestinationPath coviscrabble-windows.zip

      - name: Package archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czvf ../coviscrabble-linux.tar.gz *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release_assets/ \;
          ls -la release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
          name: COVI-SCRABBLE ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🎮 COVI-SCRABBLE ${{ github.ref_name }}

            Standalone, zero-install executables ready to play:

            - **macOS**: `coviscrabble-macos.zip` (Double-clickable application bundle)
            - **Windows**: `coviscrabble-windows.zip` (Standalone `.exe` executable)
            - **Linux**: `coviscrabble-linux.tar.gz` (Standalone binary package)

            #### 🚀 Quick Start:
            1. Download the archive corresponding to your operating system below.
            2. Extract the archive.
            3. Double-click on `CoviScrabble` (Client) to play, or `CoviScrabble-Server` to host a game.
            4. Check `QUICKSTART.txt` inside the archive for connection details and preconfigured test accounts (`toto`/`toto`, `titi`/`titi`).
